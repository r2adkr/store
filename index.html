<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>부산 편의로드 - 24BUSAN</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Leaflet.markercluster CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  
  <!-- Custom Glassmorphism Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="w-screen h-screen overflow-hidden bg-slate-100 font-sans">

  <!-- ======================================================== -->
  <!-- MAIN FULLSCREEN MAP BACKGROUND                           -->
  <!-- ======================================================== -->
  <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

  <!-- ======================================================== -->
  <!-- FLOATING MAP CONTROLS (Top Right)                        -->
  <!-- ======================================================== -->
  <div class="absolute top-4 right-4 z-20 flex flex-col gap-2.5">
    
    <!-- Close / Toggle All Windows Button (Panel Show/Hide) -->
    <button id="toggle-panel-btn" class="glass-pill px-3 py-2 rounded-2xl flex items-center gap-1.5 text-xs font-black text-zinc-800 hover:text-zinc-950 transition-all active:scale-95 shadow-lg border border-white/80" title="패널 열기/닫기">
      <svg id="toggle-panel-icon" class="w-4 h-4 text-zinc-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"></path></svg>
      <span id="toggle-panel-text">패널 닫기</span>
    </button>

    <button id="map-my-location-btn" class="glass-pill w-11 h-11 rounded-2xl flex items-center justify-center text-zinc-700 hover:text-blue-600 transition-all active:scale-95 shadow-md" title="내 위치로 이동">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 18v4m0-20v4m8 8h4M2 12h4m14 0a8 8 0 11-16 0 8 8 0 0116 0z"></path></svg>
    </button>

    <button id="map-reset-btn" class="glass-pill w-11 h-11 rounded-2xl flex items-center justify-center text-zinc-700 hover:text-zinc-950 transition-all active:scale-95 shadow-md" title="부산 전체 보기">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
    </button>
  </div>

  <!-- ======================================================== -->
  <!-- DESKTOP FLOATING GLASS PANEL (Left Side)                 -->
  <!-- ======================================================== -->
  <div id="desktop-panel" class="hidden lg:flex absolute top-4 left-4 bottom-4 w-[420px] flex-col glass-card rounded-3xl z-20 overflow-hidden transition-all duration-300">
    
    <!-- Header with Close Button -->
    <div class="px-5 py-4 flex items-center justify-between border-b border-white/50 bg-white/30 shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-zinc-900/90 text-white font-black text-sm flex items-center justify-center shadow-md shadow-zinc-900/20">
          24
        </div>
        <div>
          <h1 class="font-black text-base tracking-tight text-zinc-900 leading-none">부산 편의로드</h1>
          <p class="text-[11px] text-zinc-500 font-bold mt-1">2,780개 실시간 상권 데이터</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Favorites Toggle Pill -->
        <button id="favorites-toggle-btn" class="glass-pill px-3 py-1.5 rounded-full text-xs font-bold text-zinc-700 hover:text-zinc-950 flex items-center gap-1.5 transition-all">
          <svg class="w-3.5 h-3.5 fill-amber-400 text-amber-500" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          <span>즐겨찾기</span>
          <span id="favorites-count-badge" class="hidden items-center justify-center w-4 h-4 rounded-full bg-amber-500 text-white text-[10px] font-black">0</span>
        </button>

        <!-- Close Panel X Button -->
        <button id="panel-close-btn" class="glass-pill p-1.5 rounded-full text-zinc-500 hover:text-zinc-900 transition-colors" title="패널 접기">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>

    <!-- Controls Area -->
    <div class="p-4 space-y-3.5 border-b border-white/50 bg-white/20 shrink-0">
      
      <!-- Custom Search Bar -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <input type="text" id="search-input" placeholder="편의점, 지점명, 도로명 검색..." 
               class="w-full pl-10 pr-9 py-2.5 text-xs font-semibold bg-white/70 border border-white/80 rounded-2xl text-zinc-900 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900/10 transition-all shadow-sm">
        <button id="search-clear-btn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-zinc-300 hover:text-zinc-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Custom Dropdowns (Gu & Sort) -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        
        <!-- Custom Gu Dropdown -->
        <div class="relative" id="custom-gu-dropdown">
          <label class="block text-[11px] font-bold text-zinc-500 mb-1">지역 (구·군)</label>
          <div class="dropdown-trigger flex items-center justify-between px-3 py-2 bg-white/70 border border-white/80 rounded-2xl font-bold text-zinc-800 cursor-pointer shadow-sm">
            <span id="custom-gu-label" class="truncate">부산 전체 (16개 구·군)</span>
            <svg class="w-3.5 h-3.5 text-zinc-400 shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
          <div class="custom-dropdown-panel" id="custom-gu-panel">
            <div class="custom-dropdown-item active" data-val="all">부산 전체 (16개 구·군)</div>
          </div>
        </div>

        <!-- Custom Sort Dropdown -->
        <div class="relative" id="custom-sort-dropdown">
          <label class="block text-[11px] font-bold text-zinc-500 mb-1">정렬 기준</label>
          <div class="dropdown-trigger flex items-center justify-between px-3 py-2 bg-white/70 border border-white/80 rounded-2xl font-bold text-zinc-800 cursor-pointer shadow-sm">
            <span id="custom-sort-label" class="truncate">거리 가까운 순</span>
            <svg class="w-3.5 h-3.5 text-zinc-400 shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
          <div class="custom-dropdown-panel" id="custom-sort-panel">
            <div class="custom-dropdown-item active" data-val="distance">거리 가까운 순</div>
            <div class="custom-dropdown-item" data-val="name">상호명 (가나다순)</div>
          </div>
        </div>

      </div>

      <!-- Brand Filter Chips -->
      <div>
        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5">브랜드 분류</label>
        <div id="brand-filter-group" class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
          <!-- Injected via app.js -->
        </div>
      </div>

      <!-- Location Status & Presets -->
      <div class="pt-2 border-t border-white/60 flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5 overflow-hidden">
          <span class="w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
          <span id="current-location-display" class="truncate text-zinc-600 font-bold">위치 미확인</span>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button id="my-location-btn" class="glass-pill px-2.5 py-1 rounded-xl text-blue-600 font-bold hover:bg-blue-50/80 transition-all flex items-center gap-1 text-[11px]">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 18v4m0-20v4m8 8h4M2 12h4m14 0a8 8 0 11-16 0 8 8 0 0116 0z"></path></svg>
            <span>GPS 갱신</span>
          </button>

          <!-- Custom Landmark Dropdown -->
          <div class="relative" id="custom-landmark-dropdown">
            <div class="dropdown-trigger glass-pill px-2.5 py-1 rounded-xl text-[11px] font-bold text-zinc-700 cursor-pointer flex items-center gap-1">
              <span id="custom-landmark-label">거점 체험</span>
              <svg class="w-3 h-3 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
            <div class="custom-dropdown-panel right-0 left-auto w-44" id="custom-landmark-panel">
              <!-- Injected via app.js -->
            </div>
          </div>
        </div>
      </div>

      <!-- Radius Filter Chips -->
      <div class="flex items-center gap-1 text-[11px] pt-1">
        <span class="text-zinc-500 font-bold shrink-0 mr-1">반경:</span>
        <div id="radius-filter-group" class="flex items-center gap-1">
          <button data-radius="all" class="px-2.5 py-0.5 rounded-full bg-zinc-900 text-white font-bold text-[11px]">전체</button>
          <button data-radius="300" class="glass-pill px-2.5 py-0.5 rounded-full text-zinc-700 font-bold text-[11px] hover:bg-white">300m</button>
          <button data-radius="500" class="glass-pill px-2.5 py-0.5 rounded-full text-zinc-700 font-bold text-[11px] hover:bg-white">500m</button>
          <button data-radius="1000" class="glass-pill px-2.5 py-0.5 rounded-full text-zinc-700 font-bold text-[11px] hover:bg-white">1km</button>
          <button data-radius="3000" class="glass-pill px-2.5 py-0.5 rounded-full text-zinc-700 font-bold text-[11px] hover:bg-white">3km</button>
        </div>
      </div>

    </div>

    <!-- List Header Stats -->
    <div class="px-5 py-2.5 bg-white/30 border-b border-white/50 flex items-center justify-between text-xs font-bold text-zinc-600 shrink-0">
      <span>검색 결과: <strong id="result-count-text" class="text-zinc-950 font-black">0</strong>개 매장</span>
      <span class="text-[11px] text-zinc-400">카드를 누르면 지도가 이동합니다</span>
    </div>

    <!-- Infinite Scroll Store Cards Container -->
    <div id="store-list-container" class="flex-1 overflow-y-auto p-4 space-y-2">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- MOBILE FLOATING GLASS SEARCH HEADER                      -->
  <!-- ======================================================== -->
  <div class="lg:hidden absolute top-3 inset-x-3 z-20 flex flex-col gap-2">
    <div class="glass-card p-2 rounded-3xl shadow-xl flex items-center gap-2 border border-white/80">
      <div class="w-8 h-8 rounded-2xl bg-zinc-900 text-white font-black text-xs flex items-center justify-center shrink-0 shadow-sm">
        24
      </div>
      
      <div class="relative flex-1">
        <input type="text" id="mobile-search-input" placeholder="편의점, 도로명 검색..." 
               class="w-full pl-3 pr-7 py-2 text-xs font-semibold bg-white/70 border border-white/90 rounded-2xl text-zinc-900 placeholder-zinc-400 focus:bg-white focus:outline-none transition-all">
      </div>

      <button id="mobile-close-all-btn" class="glass-pill p-2 rounded-2xl text-zinc-700 hover:text-zinc-950 transition-all shrink-0" title="창 닫기/열기">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"></path></svg>
      </button>

      <button id="mobile-favorites-btn" class="glass-pill p-2 rounded-2xl text-amber-500 transition-all shrink-0" title="즐겨찾기">
        <svg class="w-4 h-4 fill-amber-400" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </button>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- MOBILE BOTTOM SHEET (shadcn Drawer)                      -->
  <!-- ======================================================== -->
  <div id="mobile-drawer" class="lg:hidden absolute bottom-0 inset-x-0 glass-card rounded-t-3xl shadow-2xl z-30 flex flex-col transition-transform duration-300 ease-out drawer-snap-half overflow-hidden h-[85vh]">
    
    <!-- Drawer Drag Handle & Summary -->
    <div id="drawer-drag-handle" class="pt-3 pb-2.5 px-4 flex flex-col items-center border-b border-white/60 bg-white/40 cursor-grab shrink-0">
      <div class="w-12 h-1.5 rounded-full bg-zinc-400/60 mb-2"></div>
      
      <div class="w-full flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="font-bold text-zinc-900">부산 편의점 <strong id="drawer-result-count" class="text-blue-600 font-black">0</strong>곳 탐색 중</span>
        </div>
        <button id="mobile-minimize-btn" class="text-[11px] text-zinc-500 font-bold px-2 py-0.5 rounded-md hover:bg-white/60">창 닫기</button>
      </div>
    </div>

    <!-- Mobile Store Cards Container -->
    <div id="mobile-store-list-container" class="flex-1 overflow-y-auto p-4 space-y-2">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Data Script -->
  <script src="stores_data.js"></script>

  <!-- ES Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
